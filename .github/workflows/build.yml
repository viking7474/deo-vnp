---
name: Build and Upload
"on":
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ATL
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" modify `
            --installPath "C:\Program Files\Microsoft Visual Studio\18\Enterprise" `
            --add Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL `
            --quiet --wait --norestart

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >
          msbuild "VMP-Imports-Deobfuscator.sln"
          /p:Configuration=Release /p:Platform=x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VMP-Imports-Deobfuscator
          path: Build/
